<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Inventário (fundo)</title></head>
<body>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";
import { BASE, CH_ANUNCIO, MODAL_ANUNCIO, K_PERS, CH_USO } from "./shared.js";

// Esta página fica sempre carregada, então é ela quem toca o som do anúncio.
const som = new Audio("anuncio.mp3");
som.preload = "auto";
som.volume = 0.8;

OBR.onReady(() => {
  // Jogadores gastam/recuperam cargas pelo cliente do mestre (só ele grava na sala)
  OBR.broadcast.onMessage(CH_USO, async ev => {
    if ((await OBR.player.getRole()) !== "GM") return;
    const { pid, uid, d } = ev.data || {};
    const meta = await OBR.room.getMetadata();
    const pers = (meta[K_PERS] || []).map(p => p.id !== pid ? p : { ...p, itens: p.itens.map(i => i.uid !== uid || !i.max ? i : { ...i, at: Math.min(i.max, Math.max(0, (i.at ?? i.max) + (d > 0 ? 1 : -1))) }) });
    await OBR.room.setMetadata({ [K_PERS]: pers });
  });
  OBR.broadcast.onMessage(CH_ANUNCIO, async (evento) => {
    const dados = evento.data;
    if (!dados || !dados.nome) return;

    let tocou = false;
    try { som.currentTime = 0; await som.play(); tocou = true; } catch (e) {}

    try { await OBR.modal.close(MODAL_ANUNCIO); } catch (e) {}
    OBR.modal.open({
      id: MODAL_ANUNCIO,
      // se o som já tocou aqui, a janela do anúncio não toca de novo
      url: BASE + "anuncio.html?som=" + (tocou ? "0" : "1") + "&d=" + encodeURIComponent(JSON.stringify(dados)),
      fullScreen: true,
      hidePaper: true
    });
  });
});
</script>
</body></html>
